services:
  carebridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: carebridge:latest
    container_name: carebridge_app
    restart: always
    env_file:
      - .env
    environment:
      PORT: 8000
      RUN_MODE: ${RUN_MODE:-live}
      DATABASE_URL: sqlite:////app/runtime-data/carebridge.db
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - carebridge-data:/app/runtime-data
    networks:
      - carebridge_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  nginx:
    image: nginx:1.27-alpine
    container_name: carebridge_proxy
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      carebridge:
        condition: service_healthy
    networks:
      - carebridge_net
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  carebridge-data:
    name: carebridge_prod_data

networks:
  carebridge_net:
    driver: bridge
