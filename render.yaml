services:
  - type: web
    name: carebridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RUN_MODE
        value: live
      - key: ENVIRONMENT
        value: production
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: Qwen2.5-7B-Instruct
      - key: LLM_TIMEOUT_SECONDS
        value: "20"
      - key: GATE_ENABLED
        value: "true"
      - key: GATE_THRESHOLD
        value: "0.65"
      - key: EMBEDDINGS_ENABLED
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////app/runtime-data/carebridge.db
      - key: NURSE_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: REQUESTS_PER_MINUTE
        value: "20"
      - key: MAX_MESSAGE_LENGTH
        value: "1000"
      - key: EMERGENCY_CONTACT_TEXT
        value: "your locally verified emergency services"
      - key: BACKEND
        value: local
      - key: AMD_SERVED
        value: "false"
    disk:
      name: carebridge-data
      mountPath: /app/runtime-data
      sizeGB: 1
